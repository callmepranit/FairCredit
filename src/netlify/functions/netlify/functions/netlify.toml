
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/gemini/explain"
  to = "/.netlify/functions/gemini-explain"
  status = 200

[[redirects]]
  from = "/api/gemini/insights"
  to = "/.netlify/functions/gemini-insights"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
